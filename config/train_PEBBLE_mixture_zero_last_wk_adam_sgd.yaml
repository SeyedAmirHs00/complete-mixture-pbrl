defaults:
    - base_mixture
    - agent: sac

# this needs to be specified manually
experiment: PEBBLE_mixture_zero_last_wk_adam_sgd

# Stabilized init: zero last Linear before first preference reward update.
zero_last_layer: true

# Split optimizers: Adam on reward ensemble, SGD on trust α.
reward_lr: 0.0003
alpha_lr: 0.005

# Sweep-Into defaults for this trainer (CLI can still override).
env: metaworld_sweep-into-v2
activation: tanh
num_unsup_steps: 9000
num_train_steps: 1000000
num_interact: 5000
max_feedback: 40000
reward_batch: 50
reward_update: 10
feed_type: 6
teacher_betas: [1, 1, 1, -1]

# hydra configuration
hydra:
    run:
        dir: ./exp_pebble_mixture_zero_last_wk_adam_sgd/${env}/max_feedback${max_feedback}_feed_type${feed_type}_n${reward_batch}_l${segment}_g${teacher_gamma}_b${teacher_betas}_m${teacher_eps_mistake}_s${teacher_eps_skip}_e${teacher_eps_equal}/seed${seed}/
