version: "3.9"

services:
  mixture_pbrl:
    build:
      context: .
      dockerfile: dockerfile
    container_name: mixture_pbrl_container
    runtime: nvidia   # Requires NVIDIA Container Toolkit
    shm_size: '16gb'
    environment:
      - MUJOCO_GL=egl
      - MUJOCO_VERSION=210
      - MUJOCO_DIR=/root/.mujoco
      # Override dockerfile LD_PRELOAD (libGL/libGLEW). That preload breaks NVIDIA
      # EGL offscreen rendering needed for MetaWorld videos (record_agent_video.py).
      - LD_PRELOAD=
    volumes:
      - .:/workspace   # Mount your local project
    working_dir: /workspace
    tty: true
    stdin_open: true
